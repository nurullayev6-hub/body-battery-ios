name: Rezerv
options:
  bundleIdPrefix: app.rezerv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rezerv:
    type: application
    platform: iOS
    sources:
      - path: Rezerv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rezerv.ios
        PRODUCT_NAME: Rezerv
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Rezerv/Resources/Rezerv.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Резерв
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Резерв читает сон, пульс, HRV, шаги и тренировки, чтобы рассчитать запас энергии. Данные не покидают телефон."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Резерв ничего не записывает в Здоровье."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    info:
      path: Rezerv/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.rezerv.refresh]
        UIRequiredDeviceCapabilities: [healthkit]
