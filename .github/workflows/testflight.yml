name: TestFlight

# Нужен платный аккаунт Apple Developer и секреты репозитория:
#   APPLE_TEAM_ID        — Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           — ID ключа App Store Connect API (роль App Manager или Admin)
#   ASC_ISSUER_ID        — Issuer ID
#   ASC_KEY_P8           — содержимое файла AuthKey_XXXX.p8
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Rezerv.xcodeproj -scheme Rezerv -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Rezerv.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive | tail -40
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath build/Rezerv.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
