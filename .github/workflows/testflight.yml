name: TestFlight

# Платный аккаунт Apple Developer. Секреты репозитория (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID  — Team ID (developer.apple.com → Account → Membership details)
#   BUNDLE_ID      — идентификатор приложения, например com.hasan.rezerv (App ID с включённым HealthKit)
#   ASC_KEY_ID     — Key ID ключа App Store Connect API (доступ Admin)
#   ASC_ISSUER_ID  — Issuer ID со страницы ключей
#   ASC_KEY_P8     — всё содержимое файла AuthKey_XXXXXXXXXX.p8
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check secrets
        id: check
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$K" ]; then echo "Секреты TestFlight не заданы, пропускаю."; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Select Xcode
        if: steps.check.outputs.ok == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        if: steps.check.outputs.ok == 'true'
        run: |
          brew install xcodegen
          xcodegen generate
          fastlane --version || sudo gem install fastlane -N
      - name: Build and upload
        if: steps.check.outputs.ok == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane beta
