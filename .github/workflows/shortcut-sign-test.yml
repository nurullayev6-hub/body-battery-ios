name: Shortcut sign test
on:
  push:
    branches: [ci-shortcut-test]
jobs:
  sign:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers; which shortcuts; shortcuts --help || true
      - run: |
          cp shortcuts/test.plist test.shortcut
          shortcuts sign --mode anyone --input test.shortcut --output signed.shortcut -v 2>&1 || echo "SIGN FAILED $?"
          ls -la *.shortcut
          head -c 4 signed.shortcut | xxd || true
